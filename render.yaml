services:
  - type: web
    name: cognix-core-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: COGNIX_CORS_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false

  - type: worker
    name: cognix-core-worker
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COGNIX_WORKER_POLL_SECONDS
        value: "2"
