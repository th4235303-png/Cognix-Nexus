services:
  - type: web
    name: Cognix-Core
    autoDeployTrigger: commit
    runtime: python
    rootDir: apps/web-platform/backend
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: COGNIX_ENV
        value: "production"
      - key: DEBUG
        value: "false"
      - key: COGNIX_DEV_MODE
        value: "false"
      - key: COGNIX_LOG_LEVEL
        value: "INFO"
      - key: COGNIX_CORS_ORIGINS
        value: "https://cognix-nexus-frontend.onrender.com"
      - key: COGNIX_ALLOWED_HOSTS
        value: "cognix-core-ypak.onrender.com,cognix-nexus-frontend.onrender.com"
      - key: COGNIX_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: COGNIX_RATE_LIMIT_MAX_IDENTITIES
        value: "10000"
      - key: COGNIX_REQUIRE_DATABASE
        value: "true"
      - key: QSTASH_URL
        value: "https://qstash-us-east-1.upstash.io"
      - key: QSTASH_TOKEN
        sync: false
      - key: QSTASH_CALLBACK_URL
        value: "https://cognix-core-worker-runtime.onrender.com/qstash/process"
      - key: QSTASH_CALLBACK_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        value: "https://enabling-arachnid-199174.upstash.io"
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: COGNIX_AUTH_REQUIRED
        value: "true"
      - key: COGNIX_JWT_JWKS_URL
        value: "https://jarfusheiqkfcbeljvhj.supabase.co/auth/v1/.well-known/jwks.json"
      - key: COGNIX_JWT_ISSUER
        value: "https://jarfusheiqkfcbeljvhj.supabase.co/auth/v1"
      - key: COGNIX_JWT_AUDIENCE
        value: "authenticated"
      - key: COGNIX_PROCESSING_PROVIDER
        value: "ai"
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: COHERE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: VOYAGE_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: COGNIX_DRIVE_PROVIDER
        value: "google"
      - key: COGNIX_BOOK_STORAGE_PROVIDER
        value: "tiered"
      - key: COGNIX_B2_LARGE_FILE_THRESHOLD_BYTES
        value: "52428800"
      - key: COGNIX_MAX_BOOK_UPLOAD_BYTES
        value: "209715200"
      - key: COGNIX_MEDIA_STORAGE_PROVIDER
        value: "cloudinary"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_RESOURCE_TYPE
        value: "raw"
      - key: CLOUDINARY_DELIVERY_TYPE
        value: "authenticated"
      - key: CLOUDINARY_MAX_RAW_BYTES
        value: "10485760"
      - key: COGNIX_B2_ENDPOINT
        sync: false
      - key: COGNIX_B2_BUCKET
        sync: false
      - key: COGNIX_B2_KEY_ID
        sync: false
      - key: COGNIX_B2_APPLICATION_KEY
        sync: false
      - key: COGNIX_B2_REGION
        value: "eu-central-003"
      - key: SUPABASE_URL
        value: "https://jarfusheiqkfcbeljvhj.supabase.co"
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COGNIX_SUPABASE_STORAGE_BUCKET
        value: "cognix-artifacts"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: "https://cognix-core-ypak.onrender.com/integrations/google-drive/callback"
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: SENTRY_ENVIRONMENT
        value: "production"
      - key: SENTRY_TRACES_SAMPLE_RATE
        value: "0.2"
      - key: COGNIX_OCR_TESSERACT_CONFIG
        value: "--psm 3"
      - key: TELEGRAM_ENABLED
        value: "false"
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

