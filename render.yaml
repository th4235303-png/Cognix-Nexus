services:
  - type: web
    name: cognix-core-api
    autoDeployTrigger: off
    runtime: python
    rootDir: web-platform/backend
    buildCommand: pip install -r requirements.lock
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: COGNIX_CORS_ORIGINS
        sync: false
      - key: COGNIX_ALLOWED_HOSTS
        sync: false
      - key: COGNIX_RATE_LIMIT_PER_MINUTE
        value: "120"
      - key: COGNIX_RATE_LIMIT_MAX_IDENTITIES
        value: "10000"
      - key: COGNIX_REQUIRE_DATABASE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: COGNIX_AUTH_REQUIRED
        value: "true"
      - key: COGNIX_JWT_JWKS_URL
        sync: false
      - key: COGNIX_JWT_ISSUER
        sync: false
      - key: COGNIX_JWT_AUDIENCE
        sync: false
      - key: COGNIX_PROCESSING_PROVIDER
        value: "ai"
      - key: COGNIX_AI_BASE_URL
        sync: false
      - key: COGNIX_AI_API_KEY
        sync: false
      - key: COGNIX_AI_MODEL
        sync: false
      - key: COGNIX_DRIVE_PROVIDER
        value: "google"
      - key: COGNIX_BOOK_STORAGE_PROVIDER
        value: "cloudinary"
      - key: COGNIX_MEDIA_STORAGE_PROVIDER
        value: "cloudinary"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_RESOURCE_TYPE
        value: "raw"
      - key: CLOUDINARY_DELIVERY_TYPE
        value: "authenticated"
      - key: CLOUDINARY_MAX_RAW_BYTES
        value: "10485760"
      - key: COGNIX_B2_ENDPOINT
        sync: false
      - key: COGNIX_B2_BUCKET
        sync: false
      - key: COGNIX_B2_KEY_ID
        sync: false
      - key: COGNIX_B2_APPLICATION_KEY
        sync: false
      - key: COGNIX_B2_REGION
        value: "us-east-005"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COGNIX_SUPABASE_STORAGE_BUCKET
        value: "cognix-artifacts"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: GOOGLE_DRIVE_ROOT_FOLDER_ID
        sync: false
      - key: SENTRY_DSN
        sync: false

  - type: worker
    name: cognix-core-worker
    autoDeployTrigger: off
    runtime: python
    rootDir: web-platform/backend
    buildCommand: pip install -r requirements.lock
    startCommand: python -m app.worker
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: COGNIX_REQUIRE_DATABASE
        value: "true"
      - key: COGNIX_WORKER_POLL_SECONDS
        value: "2"
      - key: COGNIX_PROCESSING_PROVIDER
        value: "ai"
      - key: COGNIX_AI_BASE_URL
        sync: false
      - key: COGNIX_AI_API_KEY
        sync: false
      - key: COGNIX_AI_MODEL
        sync: false
      - key: COGNIX_BOOK_STORAGE_PROVIDER
        value: "cloudinary"
      - key: COGNIX_MEDIA_STORAGE_PROVIDER
        value: "cloudinary"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_RESOURCE_TYPE
        value: "raw"
      - key: CLOUDINARY_DELIVERY_TYPE
        value: "authenticated"
      - key: COGNIX_B2_ENDPOINT
        sync: false
      - key: COGNIX_B2_BUCKET
        sync: false
      - key: COGNIX_B2_KEY_ID
        sync: false
      - key: COGNIX_B2_APPLICATION_KEY
        sync: false
      - key: COGNIX_B2_REGION
        value: "us-east-005"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: COGNIX_SUPABASE_STORAGE_BUCKET
        value: "cognix-artifacts"
      - key: COGNIX_DRIVE_PROVIDER
        value: "google"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
