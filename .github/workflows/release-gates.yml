name: Cognix Nexus Release Gates

on:
  workflow_dispatch:
    inputs:
      run_provider_e2e:
        description: "Run real provider E2E (requires configured production-safe secrets)"
        required: false
        default: false
        type: boolean
      run_book_contract:
        description: "Run Book Intelligence synthetic contract against DATABASE_URL"
        required: false
        default: false
        type: boolean
      run_browser_smoke:
        description: "Run authenticated Playwright smoke"
        required: false
        default: false
        type: boolean

jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/release_gate_preflight.py

  provider-e2e:
    if: ${{ inputs.run_provider_e2e }}
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      COGNIX_PROVIDER_E2E_RUN_ID: ${{ github.run_id }}
      DATABASE_URL: ${{ secrets.COGNIX_PROD_DATABASE_URL }}
      COGNIX_REQUIRE_DATABASE: "true"
      COGNIX_AI_API_KEY: ${{ secrets.COGNIX_AI_API_KEY }}
      COGNIX_AI_BASE_URL: ${{ secrets.COGNIX_AI_BASE_URL }}
      COGNIX_AI_MODEL: ${{ secrets.COGNIX_AI_MODEL }}
      COGNIX_LLM_API_KEY: ${{ secrets.COGNIX_LLM_API_KEY }}
      COGNIX_LLM_API_URL: ${{ secrets.COGNIX_LLM_API_URL }}
      COGNIX_LLM_MODEL: ${{ secrets.COGNIX_LLM_MODEL }}
      COGNIX_EMBEDDING_API_KEY: ${{ secrets.COGNIX_EMBEDDING_API_KEY }}
      COGNIX_EMBEDDING_API_URL: ${{ secrets.COGNIX_EMBEDDING_API_URL }}
      COGNIX_EMBEDDING_MODEL: ${{ secrets.COGNIX_EMBEDDING_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COGNIX_SUPABASE_STORAGE_BUCKET: ${{ secrets.COGNIX_SUPABASE_STORAGE_BUCKET }}
      COGNIX_B2_ENDPOINT: ${{ secrets.COGNIX_B2_ENDPOINT }}
      COGNIX_B2_BUCKET: ${{ secrets.COGNIX_B2_BUCKET }}
      COGNIX_B2_KEY_ID: ${{ secrets.COGNIX_B2_KEY_ID }}
      COGNIX_B2_APPLICATION_KEY: ${{ secrets.COGNIX_B2_APPLICATION_KEY }}
      COGNIX_B2_REGION: ${{ secrets.COGNIX_B2_REGION }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: python scripts/provider_e2e.py

  book-contract:
    if: ${{ inputs.run_book_contract }}
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      DATABASE_URL: ${{ secrets.COGNIX_PROD_DATABASE_URL }}
      COGNIX_REQUIRE_DATABASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python scripts/book_acceptance_contract.py --synthetic

  browser-smoke:
    if: ${{ inputs.run_browser_smoke }}
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/frontend
    env:
      COGNIX_E2E_BASE_URL: ${{ secrets.COGNIX_E2E_BASE_URL }}
      COGNIX_E2E_API_URL: ${{ secrets.COGNIX_E2E_API_URL }}
      COGNIX_E2E_EMAIL: ${{ secrets.COGNIX_E2E_EMAIL }}
      COGNIX_E2E_PASSWORD: ${{ secrets.COGNIX_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx --yes playwright@1.51.1 install --with-deps chromium
      - run: npm run e2e
