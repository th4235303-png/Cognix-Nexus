name: Cognix Nexus Release Gates

on:
  workflow_dispatch:
    inputs:
      run_provider_e2e:
        description: "Run real provider E2E (requires configured production-safe secrets)"
        required: false
        default: false
        type: boolean
      run_book_contract:
        description: "Run Book Intelligence synthetic contract against DATABASE_URL"
        required: false
        default: false
        type: boolean
      run_browser_smoke:
        description: "Run authenticated Playwright smoke"
        required: false
        default: false
        type: boolean
      run_sentry_probe:
        description: "Send the non-sensitive Sentry ingestion probe"
        required: false
        default: false
        type: boolean
      run_recovery_drill:
        description: "Run production backup + isolated restore drill"
        required: false
        default: false
        type: boolean

jobs:
  preflight:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      COGNIX_AI_API_KEY: ${{ secrets.COGNIX_AI_API_KEY }}
      COGNIX_AI_BASE_URL: ${{ secrets.COGNIX_AI_BASE_URL }}
      COGNIX_AI_MODEL: ${{ secrets.COGNIX_AI_MODEL }}
      COGNIX_LLM_API_KEY: ${{ secrets.COGNIX_LLM_API_KEY }}
      COGNIX_LLM_API_URL: ${{ secrets.COGNIX_LLM_API_URL }}
      COGNIX_LLM_MODEL: ${{ secrets.COGNIX_LLM_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COGNIX_EMBEDDING_API_KEY: ${{ secrets.COGNIX_EMBEDDING_API_KEY }}
      COGNIX_EMBEDDING_API_URL: ${{ secrets.COGNIX_EMBEDDING_API_URL }}
      COGNIX_EMBEDDING_MODEL: ${{ secrets.COGNIX_EMBEDDING_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COGNIX_SUPABASE_STORAGE_BUCKET: ${{ secrets.COGNIX_SUPABASE_STORAGE_BUCKET }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      COGNIX_B2_ENDPOINT: ${{ secrets.COGNIX_B2_ENDPOINT }}
      COGNIX_B2_BUCKET: ${{ secrets.COGNIX_B2_BUCKET }}
      COGNIX_B2_KEY_ID: ${{ secrets.COGNIX_B2_KEY_ID }}
      COGNIX_B2_APPLICATION_KEY: ${{ secrets.COGNIX_B2_APPLICATION_KEY }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      COGNIX_E2E_BASE_URL: ${{ secrets.COGNIX_E2E_BASE_URL }}
      COGNIX_E2E_API_URL: ${{ secrets.COGNIX_E2E_API_URL }}
      COGNIX_E2E_EMAIL: ${{ secrets.COGNIX_E2E_EMAIL }}
      COGNIX_E2E_PASSWORD: ${{ secrets.COGNIX_E2E_PASSWORD }}
      DATABASE_URL: ${{ secrets.COGNIX_PROD_DATABASE_URL }}
      COGNIX_RECOVERY_TARGET_DATABASE_URL: ${{ secrets.COGNIX_RECOVERY_TARGET_DATABASE_URL }}
      COGNIX_RUN_PROVIDER_E2E: ${{ inputs.run_provider_e2e }}
      COGNIX_RUN_BOOK_CONTRACT: ${{ inputs.run_book_contract }}
      COGNIX_RUN_BROWSER_SMOKE: ${{ inputs.run_browser_smoke }}
      COGNIX_RUN_SENTRY_PROBE: ${{ inputs.run_sentry_probe }}
      COGNIX_RUN_RECOVERY: ${{ inputs.run_recovery_drill }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/release_gate_preflight.py

  provider-e2e:
    if: ${{ inputs.run_provider_e2e }}
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      COGNIX_PROVIDER_E2E_RUN_ID: ${{ github.run_id }}
      DATABASE_URL: ${{ secrets.COGNIX_PROD_DATABASE_URL }}
      COGNIX_REQUIRE_DATABASE: "true"
      COGNIX_AI_API_KEY: ${{ secrets.COGNIX_AI_API_KEY }}
      COGNIX_AI_BASE_URL: ${{ secrets.COGNIX_AI_BASE_URL }}
      COGNIX_AI_MODEL: ${{ secrets.COGNIX_AI_MODEL }}
      COGNIX_LLM_API_KEY: ${{ secrets.COGNIX_LLM_API_KEY }}
      COGNIX_LLM_API_URL: ${{ secrets.COGNIX_LLM_API_URL }}
      COGNIX_LLM_MODEL: ${{ secrets.COGNIX_LLM_MODEL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      COGNIX_EMBEDDING_API_KEY: ${{ secrets.COGNIX_EMBEDDING_API_KEY }}
      COGNIX_EMBEDDING_API_URL: ${{ secrets.COGNIX_EMBEDDING_API_URL }}
      COGNIX_EMBEDDING_MODEL: ${{ secrets.COGNIX_EMBEDDING_MODEL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      COGNIX_SUPABASE_STORAGE_BUCKET: ${{ secrets.COGNIX_SUPABASE_STORAGE_BUCKET }}
      COGNIX_B2_ENDPOINT: ${{ secrets.COGNIX_B2_ENDPOINT }}
      COGNIX_B2_BUCKET: ${{ secrets.COGNIX_B2_BUCKET }}
      COGNIX_B2_KEY_ID: ${{ secrets.COGNIX_B2_KEY_ID }}
      COGNIX_B2_APPLICATION_KEY: ${{ secrets.COGNIX_B2_APPLICATION_KEY }}
      COGNIX_B2_REGION: ${{ secrets.COGNIX_B2_REGION }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_ROOT_FOLDER_ID }}
      COGNIX_DRIVE_PROVIDER: google
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements.lock
      - run: pip install -r requirements.lock
      - run: python scripts/provider_e2e.py

  recovery-drill:
    if: ${{ inputs.run_recovery_drill }}
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      DATABASE_URL: ${{ secrets.COGNIX_PROD_DATABASE_URL }}
      COGNIX_RECOVERY_TARGET_DATABASE_URL: ${{ secrets.COGNIX_RECOVERY_TARGET_DATABASE_URL }}
      COGNIX_ALLOW_RESTORE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PostgreSQL 17 client
        run: |
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /usr/share/keyrings/postgresql.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Backup production database
        run: python scripts/backup_restore_drill.py --dump /tmp/cognix-production.dump
      - name: Verify backup checksum
        run: test -s /tmp/cognix-production.dump && python scripts/backup_restore_drill.py --verify /tmp/cognix-production.dump
      - name: Restore into isolated recovery database
        run: python scripts/backup_restore_drill.py --restore /tmp/cognix-production.dump --target-dsn "$COGNIX_RECOVERY_TARGET_DATABASE_URL" --allow-restore

  book-contract:
    if: ${{ inputs.run_book_contract }}
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      DATABASE_URL: ${{ secrets.COGNIX_PROD_DATABASE_URL }}
      COGNIX_REQUIRE_DATABASE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python scripts/book_acceptance_contract.py --synthetic

  browser-smoke:
    if: ${{ inputs.run_browser_smoke }}
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/frontend
    env:
      COGNIX_E2E_BASE_URL: ${{ secrets.COGNIX_E2E_BASE_URL }}
      COGNIX_E2E_API_URL: ${{ secrets.COGNIX_E2E_API_URL }}
      COGNIX_E2E_EMAIL: ${{ secrets.COGNIX_E2E_EMAIL }}
      COGNIX_E2E_PASSWORD: ${{ secrets.COGNIX_E2E_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx --yes playwright@1.51.1 install --with-deps chromium
      - run: npm run e2e

  sentry-probe:
    if: ${{ inputs.run_sentry_probe }}
    needs: preflight
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    env:
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      SENTRY_ENVIRONMENT: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.lock
      - run: python scripts/sentry_live_check.py
