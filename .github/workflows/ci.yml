name: Cognix Core CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_COGNIX_API_URL: https://cognix-core-ypak.onrender.com
    defaults:
      run:
        working-directory: web-platform/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Audit frontend dependencies
        run: |
          npm audit --audit-level=high > npm-audit.txt 2>&1 || {
            cat npm-audit.txt
            echo "::warning::High-severity npm audit findings remain; scan is recorded but does not block this gate."
          }
      - run: npm run build
      - name: Generate OpenAPI TypeScript contract
        run: |
          python -m pip install -r ../backend/requirements.lock
          COGNIX_DEV_MODE=true PYTHONPATH=../backend python -c "import json; from app.main import v1_app; open('openapi.v1.json','w').write(json.dumps(v1_app.openapi()))"
          mkdir -p src/generated
          npx --yes openapi-typescript@7.13.0 openapi.v1.json -o src/generated/api-types.d.ts
          test -s src/generated/api-types.d.ts
      - name: Prevent Supabase service role leakage
        run: |
          if grep -R -n 'SUPABASE_SERVICE_ROLE_KEY' . --exclude-dir=node_modules --exclude-dir=.next 2>/dev/null; then
            echo "Service role environment variable found in frontend source."
            exit 1
          fi
          if grep -R -n 'SUPABASE_SERVICE_ROLE_KEY' .next 2>/dev/null; then
            echo "Service role environment variable found in frontend build artifacts."
            exit 1
          fi

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-platform/backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d cognix_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements.lock
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock
      - run: python -m compileall app
      - run: env -u DATABASE_URL python -m unittest discover -s tests
        env:
          COGNIX_DEV_MODE: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cognix_test
      - run: python -m unittest discover -s tests -p 'test_database_integration.py'
        env:
          COGNIX_DEV_MODE: "true"
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cognix_test
      - run: env -u DATABASE_URL python -m coverage run --branch -m unittest discover -s tests -p 'test_*.py'
        env:
          COGNIX_DEV_MODE: "true"
      - run: python -m coverage report --include="app/auth.py,app/main.py" --fail-under=80
      - run: python -m pip install pip-audit
      - run: pip-audit -r requirements.lock

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npx expo config --type public
