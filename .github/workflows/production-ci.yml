name: Production CI/CD Pipeline (Non-Docker)

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cognix-production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect deployed-service source changes
    runs-on: ubuntu-latest
    outputs:
      backend_changed: ${{ steps.paths.outputs.backend_changed }}
      frontend_changed: ${{ steps.paths.outputs.frontend_changed }}
    steps:
      - name: Checkout full history for path comparison
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed paths
        id: paths
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || -z "${BEFORE_SHA:-}" || "$BEFORE_SHA" =~ ^0+$ ]]; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          else
            base="$BEFORE_SHA"
          fi
          if [[ -n "$base" ]] && git cat-file -e "$base^{commit}" 2>/dev/null; then
            changed_files="$(git diff --name-only "$base" "$GITHUB_SHA")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA")"
          fi
          backend_changed=false
          frontend_changed=false
          while IFS= read -r path; do
            case "$path" in
              apps/web-platform/backend/*|render.yaml)
                backend_changed=true
                ;;
            esac
            case "$path" in
              apps/web-platform/frontend/*|render.yaml)
                frontend_changed=true
                ;;
            esac
          done <<< "$changed_files"
          echo "backend_changed=$backend_changed" >> "$GITHUB_OUTPUT"
          echo "frontend_changed=$frontend_changed" >> "$GITHUB_OUTPUT"
          echo "Detected source changes: backend=$backend_changed frontend=$frontend_changed"
  backend-quality:
    name: Backend Lint, Compile & Migration Pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/web-platform/backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/web-platform/backend/requirements.txt
          pip install flake8 pytest

      - name: Compile Python Sources
        run: |
          python -m compileall -q apps/web-platform/backend

      - name: Backend Lint Check
        run: |
          flake8 apps/web-platform/backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Pre-flight Migration Runner Check
        env:
          PYTHONPATH: apps/web-platform/backend
        run: |
          python scripts/production_migrate.py

      - name: Execute Backend Tests
        env:
          COGNIX_ENV: test
          COGNIX_RATE_LIMIT_PER_MINUTE: "0"
          PYTHONPATH: apps/web-platform/backend
        run: |
          pytest -q apps/web-platform/backend/tests

  frontend-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/web-platform/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: apps/web-platform/frontend
        run: npm ci

      - name: Next.js Production Build
        working-directory: apps/web-platform/frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_COGNIX_API_URL: https://cognix.yourdomain.com/v1
        run: npm run build

      - name: Verify Secret Leak Prevention
        working-directory: apps/web-platform/frontend
        run: |
          if grep -R -n 'SUPABASE_SERVICE_ROLE_KEY' .next 2>/dev/null; then
            echo "Security Error: Service role key found in frontend build."
            exit 1
          fi

  production-gate:
    name: Production Release Gate
    needs: [detect-changes, backend-quality, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify live API health and readiness
        if: github.event_name != 'pull_request'
        env:
          COGNIX_API_BASE_URL: https://cognix-core-ypak.onrender.com
        run: python3 apps/web-platform/backend/scripts/render_health_check.py

      - name: Verify live API revision matches the candidate commit
        if: github.event_name != 'pull_request' && needs.detect-changes.outputs.backend_changed == 'true'
        env:
          COGNIX_API_BASE_URL: https://cognix-core-ypak.onrender.com
          EXPECTED_DEPLOY_REVISION: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ["COGNIX_API_BASE_URL"].rstrip("/") + "/health"
          with urllib.request.urlopen(url, timeout=30) as response:
              payload = json.loads(response.read())
          actual = payload.get("revision")
          expected = os.environ["EXPECTED_DEPLOY_REVISION"]
          if actual != expected:
              raise SystemExit(
                  f"API revision mismatch: expected {expected}, got {actual!r}"
              )
          print(f"PASS API revision matches candidate: {actual}")
          PY

      - name: Verify live worker health and PostgreSQL persistence
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 180 \
            --connect-timeout 10 --max-time 30 \
            https://cognix-core-worker-runtime.onrender.com/health \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; assert d.get("persistence") == "postgresql", d; assert d.get("database") is True, d; print("PASS worker health: status=ok persistence=postgresql database=true")'

      - name: Verify live worker revision matches the candidate commit
        if: github.event_name != 'pull_request' && needs.detect-changes.outputs.backend_changed == 'true'
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 180 \
            --connect-timeout 10 --max-time 30 \
            https://cognix-core-worker-runtime.onrender.com/health \
            | python3 -c 'import json,os,sys; d=json.load(sys.stdin); assert d.get("revision") == os.environ["GITHUB_SHA"], {"expected_revision": os.environ["GITHUB_SHA"], "response": d}; print("PASS worker revision matches candidate: "+d["revision"])'

      - name: Verify live frontend HTTPS and HTML response
        if: github.event_name != 'pull_request'
        run: |
          python3 - <<'PY'
          import ssl
          import urllib.request

          url = "https://cognix-nexus-frontend.onrender.com/"
          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Cognix-Production-Smoke/1.0"},
          )
          with urllib.request.urlopen(
              request, timeout=30, context=ssl.create_default_context()
          ) as response:
              content_type = response.headers.get("Content-Type", "")
              body = response.read(1024 * 1024)
              if not 200 <= response.status < 300:
                  raise SystemExit(f"frontend returned HTTP {response.status}")
              if "text/html" not in content_type.lower():
                  raise SystemExit(f"unexpected frontend content type: {content_type}")
              if not body.strip():
                  raise SystemExit("frontend returned an empty HTML response")
              print(
                  f"PASS frontend HTTPS: HTTP {response.status}, "
                  f"content-type={content_type}, bytes_checked={len(body)}"
              )
          PY

      - name: Confirm CI Readiness (Not Production Authorization)
        run: echo "Build, tests, API health/readiness, and frontend HTTPS smoke passed. Supabase leaked-password protection is explicitly deferred under the current free-tier decision. Production release still requires real backup/restore/rollback and remaining external acceptance evidence; CI success is not release authorization."
