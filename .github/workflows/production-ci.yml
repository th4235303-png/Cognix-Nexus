name: Production CI/CD Pipeline (Non-Docker)

on:
  push:
    branches: [main, master, release/*]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: cognix-production-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend Lint, Compile & Migration Pre-flight
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: web-platform/backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r web-platform/backend/requirements.txt
          pip install flake8 pytest

      - name: Compile Python Sources
        run: |
          python -m compileall -q web-platform/backend

      - name: Backend Lint Check
        run: |
          flake8 web-platform/backend --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Pre-flight Migration Runner Check
        env:
          PYTHONPATH: web-platform/backend
        run: |
          python scripts/production_migrate.py

      - name: Execute Backend Tests
        env:
          COGNIX_ENV: test
          PYTHONPATH: web-platform/backend
        run: |
          pytest -q web-platform/backend/tests

  frontend-build:
    name: Next.js Frontend Production Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web-platform/frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: web-platform/frontend
        run: npm ci

      - name: Next.js Production Build
        working-directory: web-platform/frontend
        env:
          NODE_ENV: production
          NEXT_PUBLIC_COGNIX_API_URL: https://cognix.yourdomain.com/v1
        run: npm run build

      - name: Verify Secret Leak Prevention
        working-directory: web-platform/frontend
        run: |
          if grep -R -n 'SUPABASE_SERVICE_ROLE_KEY' .next 2>/dev/null; then
            echo "Security Error: Service role key found in frontend build."
            exit 1
          fi

  production-gate:
    name: Production Release Gate
    needs: [backend-quality, frontend-build]
    runs-on: ubuntu-latest
    steps:
      - name: Confirm Build Readiness
        run: echo "Cognix-Nexus passes all standalone production gate checks. Ready for native zero-downtime deployment."
