# ==============================================================================
# NGINX REVERSE PROXY & SECURITY HARDENING CONFIGURATION
# Project: Cognix-Nexus (Non-Docker Standalone Deployment)
# Upstream Backend: 127.0.0.1:8001 (FastAPI via systemd / PM2)
# Upstream Frontend: 127.0.0.1:3001 (Next.js Node server via systemd / PM2)
# ==============================================================================

# Rate Limiting Zone: 120 requests/minute per IP, burst up to 30
limit_req_zone $binary_remote_addr zone=cognix_api_limit:10m rate=120r/m;

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name cognix.yourdomain.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cognix.yourdomain.com;

    # SSL Configuration (TLS 1.2 & 1.3 only)
    ssl_certificate /etc/letsencrypt/live/cognix.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cognix.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:CognixSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Research Paper / Document Upload Limit (200MB)
    client_max_body_size 200M;
    client_body_buffer_size 256k;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Health & Readiness Endpoints (Bypass rate limiting)
    location ~ ^/(health|ready) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        access_log off;
    }

    # Backend API Endpoints (/v1, /sources, /processing, /usage, etc.)
    location ~ ^/(v1|sources|processing|reviews|exports|activity|usage|integrations|brain)/ {
        limit_req zone=cognix_api_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI Synthesis and PDF extraction timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Next.js Static Optimization Cache
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Frontend SSR and UI Pages (Next.js)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
