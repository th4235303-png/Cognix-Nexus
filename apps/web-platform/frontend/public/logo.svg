<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Deep Space Cybernetic Atmosphere -->
    <radialGradient id="cnBackdrop" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e2a3b" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#081924" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#03090e" stop-opacity="1" />
    </radialGradient>

    <!-- Outer Tech Tile Border Gradient -->
    <linearGradient id="tileBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Orbital Data Ring Gradient -->
    <linearGradient id="orbitalRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#67e8f9" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter for Brain and Tech Accents -->
    <filter id="neonCyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="tileDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Ambient Outer Cyan Halo -->
  <circle cx="250" cy="250" r="230" fill="none" stroke="rgba(0, 229, 255, 0.15)" stroke-width="1.5" stroke-dasharray="4 8" />

  <!-- ================= INNOVATIVE CYBERNETIC SQUIRCLE VAULT (OUTER EMBLEM) ================= -->
  <g filter="url(#tileDropShadow)">
    <!-- Main Dark Teal Squircle Tile (Matching Screenshot Container) -->
    <rect x="50" y="50" width="400" height="400" rx="100" 
          fill="url(#cnBackdrop)" 
          stroke="url(#tileBorderGrad)" 
          stroke-width="5" />

    <!-- Inner Secondary Precision Rim -->
    <rect x="62" y="62" width="376" height="376" rx="90" 
          fill="none" 
          stroke="rgba(0, 229, 255, 0.25)" 
          stroke-width="1.8" />
  </g>

  <!-- ================= INNOVATIVE OUTER TECH ELEMENTS (CYBER-CIRCUITRY) ================= -->
  <!-- 4 Futuristic Corner Telemetry Brackets on Tile -->
  <g stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <!-- Top-Left Bracket -->
    <path d="M 85 130 L 85 95 L 120 95" />
    <!-- Top-Right Bracket -->
    <path d="M 380 95 L 415 95 L 415 130" />
    <!-- Bottom-Left Bracket -->
    <path d="M 85 370 L 85 405 L 120 405" />
    <!-- Bottom-Right Bracket -->
    <path d="M 380 405 L 415 405 L 415 370" />
  </g>

  <!-- Circular Quantum Orbital Track Encircling the Brain -->
  <circle cx="250" cy="250" r="162" fill="none" stroke="url(#orbitalRingGrad)" stroke-width="1.8" stroke-dasharray="3 6" />
  <circle cx="250" cy="250" r="172" fill="none" stroke="rgba(56, 189, 248, 0.2)" stroke-width="1.2" />

  <!-- Orbiting Synaptic Pulse Nodes with Cross Ticks -->
  <g filter="url(#softGlow)">
    <!-- Top Node (12 o'clock) -->
    <circle cx="250" cy="88" r="4.5" fill="#00e5ff" />
    <circle cx="250" cy="88" r="2" fill="#ffffff" />
    <line x1="250" y1="78" x2="250" y2="82" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" />

    <!-- Bottom Node (6 o'clock) -->
    <circle cx="250" cy="412" r="4.5" fill="#00e5ff" />
    <circle cx="250" cy="412" r="2" fill="#ffffff" />
    <line x1="250" y1="418" x2="250" y2="422" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" />

    <!-- Left Node (9 o'clock) -->
    <circle cx="88" cy="250" r="4.5" fill="#00e5ff" />
    <circle cx="88" cy="250" r="2" fill="#ffffff" />
    <line x1="78" y1="250" x2="82" y2="250" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" />

    <!-- Right Node (3 o'clock) -->
    <circle cx="412" cy="250" r="4.5" fill="#00e5ff" />
    <circle cx="412" cy="250" r="2" fill="#ffffff" />
    <line x1="418" y1="250" x2="422" y2="250" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" />

    <!-- Diagonal Constellation Sparkles -->
    <circle cx="136" cy="136" r="2.5" fill="#67e8f9" opacity="0.8" />
    <circle cx="364" cy="136" r="2.5" fill="#67e8f9" opacity="0.8" />
    <circle cx="136" cy="364" r="2.5" fill="#67e8f9" opacity="0.8" />
    <circle cx="364" cy="364" r="2.5" fill="#67e8f9" opacity="0.8" />
  </g>

  <!-- ================= THE BELOVED LUCIDE BRAIN (CLEAN & PRISTINE INSIDE) ================= -->
  <!-- Scaled & Centered (Scale: 11.5x, Positioned at cx=250, cy=250) -->
  <g transform="translate(112, 112) scale(11.5)" 
     stroke="#00e5ff" 
     stroke-width="1.85" 
     stroke-linecap="round" 
     stroke-linejoin="round" 
     fill="none" 
     filter="url(#neonCyanGlow)">

    <!-- Left Hemisphere -->
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
    <!-- Right Hemisphere -->
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
    <!-- Center Synapse Fold -->
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
    <!-- Folds & Ridges -->
    <path d="M17.599 6.5a3 3 0 0 0 .399-1.375" />
    <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
    <path d="M3.477 10.896a4 4 0 0 1 .585-.396" />
    <path d="M19.938 10.5a4 4 0 0 1 .585.396" />
    <path d="M6 18a4 4 0 0 1-1.967-.516" />
    <path d="M19.967 17.484A4 4 0 0 1 18 18" />
  </g>
</svg>
