<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Deep Dark Teal/Slate Gradient matching user screenshot -->
    <linearGradient id="cgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e2636" />
      <stop offset="50%" stop-color="#081822" />
      <stop offset="100%" stop-color="#040b10" />
    </linearGradient>

    <!-- Neon Cyan Glow Filter matching user screenshot -->
    <filter id="cgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Tile Border Glow -->
    <filter id="borderGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container Tile with Glowing Cyan Stroke (Exact Screenshot Match) -->
  <rect x="5" y="5" width="90" height="90" rx="26" fill="url(#cgBg)" stroke="#00e5ff" stroke-width="3" filter="url(#borderGlow)" />

  <!-- Exact Lucide Brain Glyph Scaled and Centered to Match Screenshot Perfectly -->
  <g transform="translate(19, 19) scale(2.583)" stroke="#00e5ff" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#cgGlow)">
    <!-- Left Hemisphere -->
    <path d="M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z" />
    <!-- Right Hemisphere -->
    <path d="M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z" />
    <!-- Center Synapse Fold -->
    <path d="M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4" />
    <!-- Folds & Ridges -->
    <path d="M17.599 6.5a3 3 0 0 0 .399-1.375" />
    <path d="M6.003 5.125A3 3 0 0 0 6.401 6.5" />
    <path d="M3.477 10.896a4 4 0 0 1 .585-.396" />
    <path d="M19.938 10.5a4 4 0 0 1 .585.396" />
    <path d="M6 18a4 4 0 0 1-1.967-.516" />
    <path d="M19.967 17.484A4 4 0 0 1 18 18" />
  </g>
</svg>
