<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Dark Slate/Navy Tile Background -->
    <linearGradient id="cgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081326" />
      <stop offset="100%" stop-color="#040b17" />
    </linearGradient>

    <!-- Cyan Glowing Outline -->
    <linearGradient id="cgCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#00e5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <filter id="cgGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle App Container Tile with Glowing Cyan Stroke -->
  <rect x="8" y="8" width="184" height="184" rx="44" fill="url(#cgBg)" stroke="#0284c7" stroke-width="4.5" />

  <!-- Iconic Luminous Brain Glyph (Exact Screenshot Style) -->
  <g filter="url(#cgGlow)" stroke="#00e5ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Left Hemisphere Convolutions -->
    <path d="M 92 64 
             C 82 52, 60 52, 54 66 
             C 44 72, 42 90, 52 100 
             C 42 110, 44 128, 54 134 
             C 60 148, 82 148, 92 136" />
    <!-- Left Inner Folds -->
    <path d="M 66 84 C 74 84, 82 92, 82 100 C 82 108, 74 116, 66 116" stroke-width="6" />

    <!-- Right Hemisphere Convolutions -->
    <path d="M 108 64 
             C 118 52, 140 52, 146 66 
             C 156 72, 158 90, 148 100 
             C 158 110, 156 128, 146 134 
             C 140 148, 118 148, 108 136" />
    <!-- Right Inner Folds -->
    <path d="M 134 84 C 126 84, 118 92, 118 100 C 118 108, 126 116, 134 116" stroke-width="6" />

    <!-- Central Neural Fissure (Dividing Line) -->
    <line x1="100" y1="62" x2="100" y2="138" stroke="#38bdf8" stroke-width="5" />
  </g>
</svg>